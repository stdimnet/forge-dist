name: Publish AUR git package

# Pushes forge-ide-git (aur/forge-ide-git) to ssh://aur@aur.archlinux.org/forge-ide-git.git
# whenever its files change on main. The package builds the latest commit of Forge on the
# user's machine, so new Forge commits need no push; pkgver() follows them. Before pushing,
# the workflow fetches the source once so that .SRCINFO carries a current pkgver.
#
# Secret: AUR_SSH_PRIVATE_KEY (see aur.yml). Without it the package is checked but not pushed.
on:
  push:
    branches: [main]
    paths: ["aur/forge-ide-git/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aur-git
  cancel-in-progress: false

env:
  PKG: forge-ide-git

jobs:
  publish:
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - name: Install tools
        run: pacman -Syu --noconfirm --needed git openssh

      - uses: actions/checkout@v4

      - name: Update pkgver and generate .SRCINFO
        # makepkg refuses to run as root. --nobuild fetches the source and runs pkgver(),
        # which writes the current version into PKGBUILD.
        run: |
          useradd -m builder
          chown -R builder "aur/$PKG"
          cd "aur/$PKG"
          su builder -c 'makepkg --nobuild --nodeps --noconfirm && makepkg --printsrcinfo > .SRCINFO'
          cat .SRCINFO

      - name: Push to the AUR
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$AUR_SSH_PRIVATE_KEY" ]; then
            echo "::notice::No AUR_SSH_PRIVATE_KEY secret: $PKG was checked but not pushed."
            exit 0
          fi
          # Explicit paths: in a container job $HOME is /github/home, but ssh looks for
          # known_hosts in the passwd home directory.
          ssh_dir="$RUNNER_TEMP/aur-ssh"
          install -d -m 700 "$ssh_dir"
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > "$ssh_dir/key"
          chmod 600 "$ssh_dir/key"
          # Pinned host key (fingerprint SHA256:RFzBCUItH9LZS0cKB5UE6ceAYhBD5C8GeOBip8Z11+4).
          echo "aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN" > "$ssh_dir/known_hosts"
          export GIT_SSH_COMMAND="ssh -i $ssh_dir/key -o IdentitiesOnly=yes -o UserKnownHostsFile=$ssh_dir/known_hosts -o StrictHostKeyChecking=yes"
          # Cloning a package that does not exist yet gives an empty repository; the first
          # push creates the package.
          git clone "ssh://aur@aur.archlinux.org/$PKG.git" /tmp/aur
          cp "aur/$PKG/PKGBUILD" "aur/$PKG/.SRCINFO" "aur/$PKG/forge.desktop" /tmp/aur/
          cd /tmp/aur
          git config user.name "ExtremTechniker"
          git config user.email "aur@extremtechniker.io"
          git add PKGBUILD .SRCINFO forge.desktop
          if git diff --cached --quiet; then
            echo "$PKG is unchanged"
            exit 0
          fi
          git commit -m "Update PKGBUILD"
          git push origin HEAD:master
