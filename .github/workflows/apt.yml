name: Publish apt repository

# Rebuilds the whole repository from the .deb files of the latest Forge releases and
# publishes it on GitHub Pages. Start it by hand after a new Forge release.
on:
  workflow_dispatch:
    inputs:
      releases:
        description: "How many of the latest Forge releases to include"
        default: "5"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # The repository whose releases carry the .deb files.
  SOURCE_REPO: Reeperk/Forge

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install aptly
        run: sudo apt-get update && sudo apt-get install -y aptly

      - name: Download the .deb files
        env:
          # A token that can read the releases of SOURCE_REPO (needed while it is private).
          GH_TOKEN: ${{ secrets.SOURCE_TOKEN }}
          RELEASES: ${{ inputs.releases }}
        run: |
          mkdir debs
          for tag in $(gh release list -R "$SOURCE_REPO" --limit "$RELEASES" --json tagName --jq '.[].tagName'); do
            gh release download "$tag" -R "$SOURCE_REPO" --pattern '*.deb' --dir debs || true
          done
          ls -l debs

      - name: Import the signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
          fpr="$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/ {print $10; exit}')"
          echo "GPG_KEY_ID=$fpr" >> "$GITHUB_ENV"

      - name: Build the repository
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          DEB_DIR: debs
        run: deb/build-repo.sh

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
